<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎤ElPlanEsLaOfi🎤</title>
<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

body::before {
  content: "";
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg, #180b2e 0%, #3a0f52 50%, #101a45 100%);
  background-size: cover;
  z-index: -1;
  animation: changeBackground 12s infinite alternate;
}

@keyframes changeBackground {
  0% { filter: hue-rotate(0deg) brightness(1); }
  100% { filter: hue-rotate(30deg) brightness(1.15); }
}

.screen{
  position: absolute;
  top: 0; left: 0; width: 100%; min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.screen.active{
  opacity: 1;
  pointer-events: auto;
  z-index: 2;
}
.card{
  width:min(1150px, 98vw);
  background:rgba(0,0,0,0.55);
  border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(16px);
  border-radius:32px;
  padding:40px 30px;
  box-shadow:0 25px 70px rgba(0,0,0,.7);
  text-align:center;
}
h1{font-size:clamp(40px, 5vw, 62px);margin:0 0 10px;font-weight:900;}
p{font-size:20px;opacity:.9;}
.wheel-wrap{
  position:relative;
  width:min(520px, 75vw);
  aspect-ratio:1;
  margin:20px auto 30px;
}
.pointer{
  position:absolute;
  z-index:5;
  top:-12px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:24px solid transparent;
  border-right:24px solid transparent;
  border-top:44px solid #ffd54a;
  filter:drop-shadow(0 4px 6px #000);
}
canvas{
  width:100%;
  height:100%;
  border-radius:50%;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
}
button{
  border:0;
  border-radius:999px;
  padding:16px 36px;
  font-size:20px;
  font-weight:800;
  cursor:pointer;
  color:#24102f;
  background:#ffd54a;
  box-shadow:0 8px 25px rgba(0,0,0,0.3);
  transition:.2s;
}
button:hover{transform:translateY(-2px) scale(1.03);}
button:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.result{
  display:none;
  margin:20px auto 15px;
  padding:20px;
  border-radius:22px;
  background:rgba(0,0,0,.35);
}
.result.show{display:block;animation:pop .5s ease;}
.challenge-icon{font-size:75px;}
.challenge-box{
  margin:20px auto;
  max-width:800px;
  padding:30px;
  border-radius:24px;
  background:rgba(0,0,0,.35);
}
.timer{font-size:75px;font-weight:900;}
.progress{
  height:12px;
  background:rgba(255,255,255,.18);
  border-radius:20px;
  overflow:hidden;
  margin:20px 0;
}
.bar{height:100%;width:100%;background:#ffd54a;transition:width 1s linear;}
.emoji-song{font-size:70px;letter-spacing:15px;margin:20px 0;}
.word{font-size:65px;font-weight:900;color:#ffd54a;margin:20px 0;}
.spark{font-size:28px;margin-bottom:5px;}

@keyframes pop{
  0%{transform:scale(.85);opacity:0;}
  100%{transform:scale(1);opacity:1;}
}
</style>
</head>
<body>

<!-- REPRODUCTOR PRINCIPAL DEL MIX -->
<div style="position:absolute; left:-9999px; top:-9999px; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none;">
  <iframe id="youtube-audio-frame" src="" width="200" height="200" frameborder="0" allow="autoplay"></iframe>
</div>

<!-- REPRODUCTOR PARA LAS DINÁMICAS CON MÚSICA PROPIA -->
<div style="position:absolute; left:-9999px; top:-9999px; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none;">
  <iframe id="challenge-audio-frame" src="" width="200" height="200" frameborder="0" allow="autoplay"></iframe>
</div>

<section id="home" class="screen active">
  <div class="card">
    <div class="spark"> 🎤 ✨ 🔥 🪩 🏆</div>
    <h1>🎤ElPlanEsLaOfi🎤</h1>

    <div style="margin:25px auto; text-align:center;">
      <button type="button" id="musicBtn" onclick="toggleMainMusic()" style="font-size:20px; padding:16px 38px;">🎵 ACTIVAR MÚSICA</button>
    </div>

    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="1000" height="1000"></canvas>
    </div>

    <button id="spinBtn" onclick="spin()" style="font-size:22px;padding:18px 40px;">🎡 GIRAR RULETA</button>

    <div id="result" class="result">
      <div id="resultEmoji" style="font-size:55px;"></div>
      <h2 id="resultTitle" style="font-size:34px;margin:8px 0;"></h2>
      <p id="resultDesc" style="font-size:20px;margin-bottom:15px;"></p>
      <button onclick="startChallenge()" style="font-size:18px;padding:14px 30px;">🎤 COMENZAR DESAFÍO</button>
    </div>
  </div>
</section>

<section id="challenge" class="screen">
  <div class="card">
    <div id="challengeIcon" class="challenge-icon"></div>
    <h2 id="challengeTitle" style="font-size:40px;"></h2>
    <div id="challengeContent" class="challenge-box"></div>
    <button onclick="backHome()" style="font-size:18px;padding:14px 30px;">🎡 VOLVER A LA RULETA</button>
  </div>
</section>

<script>
const MIX_EMBED_URL = "https://www.youtube.com/embed/P-auj2ElqzI?autoplay=1&loop=1&playlist=P-auj2ElqzI";

let isMusicActive = false;
let wasMusicPlayingBeforeChallenge = false;
const iframeMain = document.getElementById("youtube-audio-frame");
const iframeChallenge = document.getElementById("challenge-audio-frame");

function toggleMainMusic() {
  const btn = document.getElementById("musicBtn");
  
  if (!isMusicActive) {
    iframeMain.src = MIX_EMBED_URL;
    isMusicActive = true;
    btn.textContent = "⏸️ PAUSAR MÚSICA";
    btn.style.background = "#ff5c8a";
    btn.style.color = "#fff";
  } else {
    iframeMain.src = "";
    isMusicActive = false;
    btn.textContent = "🎵 ACTIVAR MÚSICA";
    btn.style.background = "#ffd54a";
    btn.style.color = "#24102f";
  }
}

const challenges = [
  { name:["Caiga en", "la nota"], emoji:"🎵", desc:"¡Atento! Suena una canción aleatoria y debes continuarla o cantarla.", color:"#ff5c8a" },
  { name:["Adivina el nombre", "de la canción"], emoji:"🔎", desc:"Describe o tararea una canción para que los demás adivinen el título.", color:"#7c5cff" },
  { name:["Ruleta de", "palabras"], emoji:"🎰", desc:"Canta una canción que contenga la palabra seleccionada en pantalla.", color:"#00bfa6" },
  { name:["Adivina la canción", "con emojis"], emoji:"😀", desc:"Interpreta y adivina el título de la canción secreta.", color:"#ff9f43" }
];

const noteSongs = [
  { title: "Silvestre Dangond, Nicky Jam - Cásate Conmigo", id: "cpN78ZjnCZY", start: 63 },
  { title: "Hombres G - Devuélveme a mi Chica", id: "LgQYPqr9Rho", start: 0 },
  { title: "Los Auténticos Decadentes - Mil Horas", id: "1To_Wz5RWi0", start: 0 },
  { title: "Rikarena - Cuando El Amor Se Daña", id: "MB4o_V8AZa4", start: 23 },
  { title: "Eddy Herrera - Pégame Tu Vicio", id: "yWSQxGppcFA", start: 15 },
  { title: "Bacilos - Caraluna", id: "-zgDXIi1uYw", start: 0 },
  { title: "Los de Adentro - Una Canción", id: "Q9W5uIMAbb8", start: 25 },
  { title: "Carlos Baute - Colgando en tus manos", id: "qExd-3oCTl4", start: 10 }
];

let selectedIndex = 0;
let timer = null;
const wheel = document.getElementById("wheel");
const ctx = wheel.getContext("2d");
let rotation = 0;
let spinning = false;

function drawWheel(){
  const size = 1000;
  const cx = size / 2, cy = size / 2, r = 450;
  const slice = 2 * Math.PI / challenges.length;
  ctx.clearRect(0, 0, size, size);

  challenges.forEach((c,i)=>{
    const a = rotation + i * slice;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, a, a + slice);
    ctx.closePath();
    ctx.fillStyle = c.color;
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.9)";
    ctx.lineWidth = 8;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a + slice / 2);
    
    ctx.textAlign = "right";
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,0.6)";
    ctx.shadowBlur = 6;

    ctx.font = "bold 30px Arial";
    ctx.fillText(c.name[0], 340, -15);
    ctx.fillText(c.name[1], 340, 25);

    ctx.font = "bold 44px Arial";
    ctx.fillText(c.emoji, 340, 75);
    
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(cx, cy, 75, 0, Math.PI*2);
  ctx.fillStyle = "#24102f";
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.3)";
  ctx.lineWidth = 5;
  ctx.stroke();

  ctx.fillStyle = "#ffd54a";
  ctx.font = "bold 38px Arial";
  ctx.textAlign = "center";
  ctx.shadowBlur = 0;
  ctx.fillText("🏢", cx, cy+14);
}
drawWheel();

function spin(){
  if(spinning) return;
  spinning = true;
  document.getElementById("spinBtn").disabled = true;
  document.getElementById("result").classList.remove("show");

  const start = rotation;
  const turns = 7 + Math.random()*3;
  const target = start + turns * 2 * Math.PI + Math.random()*2*Math.PI;
  const duration = 4200;
  const t0 = performance.now();

  function animate(t){
    const p = Math.min(1, (t-t0)/duration);
    const ease = 1 - Math.pow(1-p, 4);
    rotation = start + (target-start)*ease;
    drawWheel();

    if(p < 1){
      requestAnimationFrame(animate);
    } else {
      const slice = 2*Math.PI / challenges.length;
      let angle = ((-Math.PI/2 - rotation) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
      selectedIndex = Math.floor(angle/slice) % challenges.length;
      showResult();
      spinning = false;
      document.getElementById("spinBtn").disabled = false;
    }
  }
  requestAnimationFrame(animate);
}

function showResult(){
  const c = challenges[selectedIndex];
  document.getElementById("resultEmoji").textContent = c.emoji;
  const fullName = c.name.join(" ");
  document.getElementById("resultTitle").textContent = "¡Te tocó: " + fullName + "!";
  document.getElementById("resultDesc").textContent = c.desc;
  document.getElementById("result").classList.add("show");
}

function startChallenge(){
  const c = challenges[selectedIndex];
  document.getElementById("home").classList.remove("active");
  document.getElementById("challenge").classList.add("active");
  document.getElementById("challengeIcon").textContent = c.emoji;
  document.getElementById("challengeTitle").textContent = c.name.join(" ");
  
  wasMusicPlayingBeforeChallenge = isMusicActive;

  // 0: Caiga en la nota (Tiene música propia)
  if (selectedIndex === 0) {
    const randomSong = noteSongs[Math.floor(Math.random() * noteSongs.length)];
    iframeChallenge.src = `https://www.youtube.com/embed/${randomSong.id}?start=${randomSong.start}&autoplay=1`;
  } 
  // 1: Adivina el nombre de la canción (Tiene música propia para tararear/adivinar, pausamos el mix de fondo)
  else if (selectedIndex === 1) {
    iframeChallenge.src = "";
  } 
  // 2 y 3: Ruleta de palabras y Adivina la canción con emojis (NO tienen música propia, el mix principal sigue sonando fluido)
  else {
    // No hacemos nada con la música para que continúe sonando sin interrupciones
  }

  renderChallenge(selectedIndex);
}

const emojiList = ["🌺🔥🎵", "🌺🌊☀️", "💎💋🔥", "🕶️🟢🔥", "🌙🐺💚"];
const songTitles = ["AMARGURA - Karol G", "PROVENZA - Karol G", "QLONA - Karol G & Peso Pluma", "CLASSY 101 - Feid", "LUNA - Feid"];
let currentAnswer = "";

function renderChallenge(i){
  const box = document.getElementById("challengeContent");
  clearInterval(timer);

  if(i === 0){
    box.innerHTML = `
      <p style="font-size:22px;">🎵 ¡Atento! Suena una canción aleatoria y debes continuarla o cantarla.</p>
      <div style="font-size:60px; margin:20px 0;">🎤🔥</div>
    `;
  } else if(i === 1){
    box.innerHTML = `
      <p style="font-size:22px;">🎧 Tararea o describe una canción para que los demás adivinen.</p>
      <div class="timer" id="timer">10</div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <button onclick="startTimer()" style="font-size:18px;padding:14px 30px;">▶️ INICIAR CRONÓMETRO</button>
    `;
  } else if(i === 2){
    const words = ["AMOR", "NOCHE", "BAILAR", "CORAZÓN", "FUEGO", "VIDA", "BESO", "SOL", "FIESTA", "LOCURA"];
    const word = words[Math.floor(Math.random() * words.length)];
    box.innerHTML = `
      <p style="font-size:20px;">La palabra secreta es:</p>
      <div class="word">${word}</div>
      <p style="font-size:20px;">🎤 Canta una canción que contenga esta palabra.</p>
    `;
  } else {
    const idx = Math.floor(Math.random() * emojiList.length);
    currentAnswer = songTitles[idx];
    box.innerHTML = `
      <p style="font-size:20px;">¿Qué canción representan estos emojis?</p>
      <div class="emoji-song">${emojiList[idx]}</div>
      <button onclick="revealEmojiSong()" style="font-size:18px;padding:14px 30px;">💡 REVELAR RESPUESTA</button>
      <div id="emojiAnswer" style="display:none;margin-top:15px;font-size:30px;font-weight:900;color:#ffd54a"></div>
    `;
  }
}

function revealEmojiSong(){
  const a = document.getElementById("emojiAnswer");
  if(a){ a.style.display = "block"; a.textContent = "🎉 " + currentAnswer; }
}

function startTimer(){
  clearInterval(timer);
  let seconds = 10;
  const t = document.getElementById("timer");
  const bar = document.getElementById("bar");
  t.textContent = seconds;
  bar.style.width = "100%";
  timer = setInterval(()=>{
    seconds--;
    t.textContent = seconds;
    bar.style.width = (seconds * 10) + "%";
    if(seconds <= 0){
      clearInterval(timer);
    }
  }, 1000);
}

function backHome(){
  clearInterval(timer);
  iframeChallenge.src = "";

  document.getElementById("challengeContent").innerHTML = "";
  document.getElementById("challenge").classList.remove("active");
  document.getElementById("home").classList.add("active");
}
</script>
</body>
</html>
