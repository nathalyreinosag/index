<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎤ElPlanEsLaOfi🎤</title>
<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

body::before {
  content: "";
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg, #180b2e 0%, #3a0f52 50%, #101a45 100%);
  background-size: cover;
  z-index: -1;
  animation: changeBackground 12s infinite alternate;
}

@keyframes changeBackground {
  0% { filter: hue-rotate(0deg) brightness(1); }
  100% { filter: hue-rotate(30deg) brightness(1.15); }
}

.screen{
  width:100%;
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.screen.active{display:flex;}
.card{
  width:min(1150px, 98vw);
  background:rgba(0,0,0,0.55);
  border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(16px);
  border-radius:32px;
  padding:40px 30px;
  box-shadow:0 25px 70px rgba(0,0,0,.7);
  text-align:center;
}
h1{font-size:clamp(40px, 5vw, 62px);margin:0 0 10px;font-weight:900;}
p{font-size:20px;opacity:.9;}
.subtitle{margin-bottom:20px;font-size:22px;}
.wheel-wrap{
  position:relative;
  width:min(520px, 75vw);
  aspect-ratio:1;
  margin:20px auto 30px;
}
.pointer{
  position:absolute;
  z-index:5;
  top:-12px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:24px solid transparent;
  border-right:24px solid transparent;
  border-top:44px solid #ffd54a;
  filter:drop-shadow(0 4px 6px #000);
}
canvas{
  width:100%;
  height:100%;
  border-radius:50%;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
}
button{
  border:0;
  border-radius:999px;
  padding:16px 36px;
  font-size:20px;
  font-weight:800;
  cursor:pointer;
  color:#24102f;
  background:#ffd54a;
  box-shadow:0 8px 25px rgba(0,0,0,0.3);
  transition:.2s;
}
button:hover{transform:translateY(-2px) scale(1.03);}
button.secondary{
  background:rgba(255,255,255,.2);
  color:#fff;
  margin-left:12px;
}
button:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.result{
  display:none;
  margin:20px auto 15px;
  padding:20px;
  border-radius:22px;
  background:rgba(0,0,0,.35);
}
.result.show{display:block;animation:pop .5s ease;}
.challenge-icon{font-size:75px;}
.challenge-box{
  margin:20px auto;
  max-width:800px;
  padding:30px;
  border-radius:24px;
  background:rgba(0,0,0,.35);
}
.timer{font-size:75px;font-weight:900;}
.progress{
  height:12px;
  background:rgba(255,255,255,.18);
  border-radius:20px;
  overflow:hidden;
  margin:20px 0;
}
.bar{height:100%;width:100%;background:#ffd54a;transition:width 1s linear;}
.emoji-song{font-size:70px;letter-spacing:15px;margin:20px 0;}
.word{font-size:65px;font-weight:900;color:#ffd54a;margin:20px 0;}
.lyrics{font-size:24px;line-height:1.5;margin:15px auto;max-width:720px;}
.spark{font-size:28px;margin-bottom:5px;}
.player-container{
  width:100%;
  max-width:720px;
  margin:15px auto;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 12px 30px rgba(0,0,0,.6);
  background:#000;
}
#youtubePlayerElement{width:100%;height:320px;}

@keyframes pop{
  0%{transform:scale(.85);opacity:0;}
  100%{transform:scale(1);opacity:1;}
}
</style>
<script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<div style="display:none;">
  <iframe id="ambientIframe" src="" allow="autoplay"></iframe>
</div>

<section id="home" class="screen active">
  <div class="card">
    <div class="spark"> 🎤 ✨ 🔥 🪩 🏆</div>
    <h1>🎤ElPlanEsLaOfi🎤</h1>
    <p class="subtitle">¡Gira la ruleta, descubre tu desafío y pasa un buen rato! 🎶</p>

    <div style="margin:15px auto 15px;text-align:center;">
      <button id="musicBtn" onclick="toggleAmbientMusic()" style="padding:14px 35px;font-size:18px;">▶️ ACTIVAR MÚSICA</button>
    </div>

    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="1000" height="1000"></canvas>
    </div>

    <button id="spinBtn" onclick="spin()" style="font-size:22px;padding:18px 40px;">🎡 GIRAR RULETA</button>

    <div id="result" class="result">
      <div id="resultEmoji" style="font-size:55px;"></div>
      <h2 id="resultTitle" style="font-size:34px;margin:8px 0;"></h2>
      <p id="resultDesc" style="font-size:20px;margin-bottom:15px;"></p>
      <button onclick="startChallenge()" style="font-size:18px;padding:14px 30px;">🎤 COMENZAR DESAFÍO</button>
    </div>
  </div>
</section>

<section id="challenge" class="screen">
  <div class="card">
    <div id="challengeIcon" class="challenge-icon"></div>
    <h2 id="challengeTitle" style="font-size:40px;"></h2>
    <div id="challengeContent" class="challenge-box"></div>
    <button onclick="backHome()" style="font-size:18px;padding:14px 30px;">🎡 VOLVER A LA RULETA</button>
  </div>
</section>

<script>
let ambientPlaying = false;
let userActivatedMusic = false;
const ambientId = "LypslWGSvSI";
let challengePlayer = null;
let volumeTimeouts = [];

function toggleAmbientMusic(){
  const btn = document.getElementById("musicBtn");
  const iframe = document.getElementById("ambientIframe");

  if(!ambientPlaying){
    userActivatedMusic = true;
    if(!iframe.src || iframe.src === "" || iframe.src === window.location.href){
      iframe.src = `https://www.youtube.com/embed/${ambientId}?autoplay=1&loop=1&playlist=${ambientId}&enablejsapi=1`;
    } else {
      iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    }
    ambientPlaying = true;
    btn.textContent = "⏸️ PAUSAR MÚSICA";
  } else {
    userActivatedMusic = false;
    iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
    ambientPlaying = false;
    btn.textContent = "▶️ ACTIVAR MÚSICA";
  }
}

const noteSongs = [
  { title:"Andas En Mi Cabeza", artist:"Chino y Nacho ft. Daddy Yankee", url:"AMTAQ-AJS4Y", time:"0:51" },
  { title:"Cásate Conmigo", artist:"Silvestre Dangond, Nicky Jam", url:"cpN78ZjnCZY", time:"1:03" },
  { title:"Devuélveme a mi Chica", artist:"Hombres G", url:"LgQYPqr9Rho", time:"0:00" },
  { title:"Mil Horas", artist:"Los Abuelos de la Nada", url:"1To_Wz5RWi0", time:"0:00" },
  { title:"Cuando El AMOR Se Daña", artist:"Rikarena", url:"MB4o_V8AZa4", time:"0:23" },
  { title:"Pégame Tu VICIO", artist:"Eddy Herrera", url:"yWSQxGppcFA", time:"0:15" },
  { title:"Caraluna", artist:"Bacilos", url:"-zgDXIi1uYw", time:"0:00" },
  { title:"Una Cancion", artist:"Los de Adentro", url:"Q9W5uIMAbb8", time:"0:25" },
  { title:"Colgando en tus manos", artist:"Carlos Baute", url:"qExd-3oCTl4", time:"0:10" },
  { title:"Nuqui (Te Quiero Para Mi)", artist:"ChocQuibTown", url:"EzbzWerC9AM", time:"0:10" },
  { title:"Morenamia", artist:"Miguel Bosé", url:"ljO63sL2CWc", time:"0:10" },
  { title:"Auto Rojo", artist:"Vilma Palma", url:"95kf6cCasfg", time:"0:30" }
];

const generalSongs = [
  { title:"AMARGURA", artist:"Karol G", url:"fEWhm_TVvUw", emojis:"🌺🔥🎵" },
  { title:"PROVENZA", artist:"Karol G", url:"ca48oMV59LU", emojis:"🌺🌊☀️" },
  { title:"QLONA", artist:"Karol G & Peso Pluma", url:"BeUOBoSPWvA", emojis:"💎💋🔥" },
  { title:"CLASSY 101", artist:"Feid & Young Miko", url:"cD5T1Y4b7wA", emojis:"🕶️🟢🔥" },
  { title:"LUNA", artist:"Feid & ATL Jacob", url:"ZA7ZKB8Mo9k", emojis:"🌙🐺💚" }
];

const challenges = [
  { name:["Caiga en", "la nota"], emoji:"🎵", desc:"Suena la canción, se baja el volumen a 0% a los 20 segundos para que cantes, y a los 10 segundos sube al 100% para verificar.", color:"#ff5c8a" },
  { name:["Adivina", "la canción"], emoji:"🔎", desc:"Escucha un fragmento y descubre el título.", color:"#7c5cff" },
  { name:["Ruleta de", "palabras"], emoji:"🎰", desc:"Canta una canción que contenga la palabra seleccionada.", color:"#00bfa6" },
  { name:["Adivina con", "emojis"], emoji:"😀", desc:"Descifra la canción representada por los emojis.", color:"#ff9f43" }
];

let currentSong = null;
let selectedIndex = 0;
let timer = null;

function clearAllTimeouts() {
  volumeTimeouts.forEach(t => clearTimeout(t));
  volumeTimeouts = [];
}

function initYTPlayer(videoId, startTime = "0", onReadyCallback) {
  let startSeconds = 0;
  if(startTime.includes(":")) {
    const parts = startTime.split(":");
    startSeconds = parseInt(parts[0]) * 60 + parseInt(parts[1]);
  } else {
    startSeconds = parseInt(startTime) || 0;
  }

  if (challengePlayer && typeof challengePlayer.destroy === 'function') {
    challengePlayer.destroy();
  }

  challengePlayer = new YT.Player('youtubePlayerElement', {
    height: '320',
    width: '100%',
    videoId: videoId,
    playerVars: {
      'autoplay': 1,
      'start': startSeconds,
      'playsinline': 1,
      'mute': 0
    },
    events: {
      'onReady': (event) => {
        event.target.unMute();
        event.target.setVolume(100);
        event.target.playVideo();
        if(onReadyCallback) onReadyCallback(event.target);
      }
    }
  });
}

const wheel = document.getElementById("wheel");
const ctx = wheel.getContext("2d");
let rotation = 0;
let spinning = false;

function drawWheel(){
  const size = 1000;
  const cx = size / 2, cy = size / 2, r = 450;
  const slice = 2 * Math.PI / challenges.length;
  ctx.clearRect(0, 0, size, size);

  challenges.forEach((c,i)=>{
    const a = rotation + i * slice;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, a, a + slice);
    ctx.closePath();
    ctx.fillStyle = c.color;
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.9)";
    ctx.lineWidth = 8;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a + slice / 2);
    
    ctx.textAlign = "right";
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,0.6)";
    ctx.shadowBlur = 6;

    ctx.font = "bold 34px Arial";
    ctx.fillText(c.name[0], 340, -15);
    ctx.fillText(c.name[1], 340, 25);

    ctx.font = "bold 44px Arial";
    ctx.fillText(c.emoji, 340, 75);
    
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(cx, cy, 75, 0, Math.PI*2);
  ctx.fillStyle = "#24102f";
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.3)";
  ctx.lineWidth = 5;
  ctx.stroke();

  ctx.fillStyle = "#ffd54a";
  ctx.font = "bold 38px Arial";
  ctx.textAlign = "center";
  ctx.shadowBlur = 0;
  ctx.fillText("🏢", cx, cy+14);
}
drawWheel();

function spin(){
  if(spinning) return;
  spinning = true;
  document.getElementById("spinBtn").disabled = true;
  document.getElementById("result").classList.remove("show");

  const start = rotation;
  const turns = 7 + Math.random()*3;
  const target = start + turns * 2 * Math.PI + Math.random()*2*Math.PI;
  const duration = 4200;
  const t0 = performance.now();

  function animate(t){
    const p = Math.min(1, (t-t0)/duration);
    const ease = 1 - Math.pow(1-p, 4);
    rotation = start + (target-start)*ease;
    drawWheel();

    if(p < 1){
      requestAnimationFrame(animate);
    } else {
      const slice = 2*Math.PI / challenges.length;
      let angle = ((-Math.PI/2 - rotation) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
      selectedIndex = Math.floor(angle/slice) % challenges.length;
      showResult();
      spinning = false;
      document.getElementById("spinBtn").disabled = false;
    }
  }
  requestAnimationFrame(animate);
}

function showResult(){
  const c = challenges[selectedIndex];
  document.getElementById("resultEmoji").textContent = c.emoji;
  const fullName = c.name.join(" ");
  document.getElementById("resultTitle").textContent = "¡Te tocó: " + fullName + "!";
  document.getElementById("resultDesc").textContent = c.desc;
  document.getElementById("result").classList.add("show");
}

function startChallenge(){
  if(ambientPlaying){
    const iframe = document.getElementById("ambientIframe");
    try {
      iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
    } catch(e) {}
  }

  const c = challenges[selectedIndex];
  document.getElementById("home").classList.remove("active");
  document.getElementById("challenge").classList.add("active");
  document.getElementById("challengeIcon").textContent = c.emoji;
  document.getElementById("challengeTitle").textContent = c.name.join(" ");
  renderChallenge(selectedIndex);
}

function renderChallenge(i){
  const box = document.getElementById("challengeContent");
  clearInterval(timer);
  clearAllTimeouts();

  if(i === 0){
    currentSong = noteSongs[Math.floor(Math.random() * noteSongs.length)];
    box.innerHTML = `
      <p style="font-size:20px;">🎵 Suena: <b>${currentSong.title}</b> de <em>${currentSong.artist}</em></p>
      <div class="player-container">
        <div id="youtubePlayerElement"></div>
      </div>
      <div class="lyrics" style="margin-top:15px">
        <strong>⚡ DINÁMICA ACTIVA:</strong><br>A los 20 segundos el volumen bajará al 0% para que cantes, y a los 10 segundos volverá al 100% para verificar si caíste en la nota exacta.
      </div>
    `;

    initYTPlayer(currentSong.url, currentSong.time, (player) => {
      // A los 20 segundos bajamos volumen a 0% y nos aseguramos de desmutear
      let t1 = setTimeout(() => {
        if(player && typeof player.setVolume === 'function') {
          player.unMute();
          player.setVolume(0);
        }
      }, 20000);

      // A los 30 segundos (20s + 10s de canto) subimos volumen a 100%
      let t2 = setTimeout(() => {
        if(player && typeof player.setVolume === 'function') {
          player.unMute();
          player.setVolume(100);
        }
      }, 30000);

      volumeTimeouts.push(t1, t2);
    });

  } else if(i === 1){
    currentSong = generalSongs[Math.floor(Math.random() * generalSongs.length)];
    box.innerHTML = `
      <p style="font-size:20px;">🎧 Escucha la canción y adivina el título o artista.</p>
      <div class="player-container"><div id="youtubePlayerElement"></div></div>
      <div class="timer" id="timer">10</div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <button onclick="startTimer()" style="font-size:18px;padding:14px 30px;">▶️ INICIAR CRONÓMETRO</button>
      <button class="secondary" onclick="revealSong()" style="font-size:18px;padding:14px 30px;">💡 REVELAR</button>
      <div id="answer" style="display:none;margin-top:15px;font-size:28px;font-weight:900;color:#ffd54a"></div>
    `;
    initYTPlayer(currentSong.url, "0");

  } else if(i === 2){
    if (challengePlayer && typeof challengePlayer.destroy === 'function') { challengePlayer.destroy(); }
    const words = ["AMOR", "NOCHE", "BAILAR", "CORAZÓN", "FUEGO", "VIDA", "BESO", "SOL", "FIESTA", "LOCURA"];
    const word = words[Math.floor(Math.random() * words.length)];
    box.innerHTML = `
      <p style="font-size:20px;">La palabra secreta es:</p>
      <div class="word">${word}</div>
      <p style="font-size:20px;">🎤 Canta una canción que contenga esta palabra.</p>
    `;
  } else {
    currentSong = generalSongs[Math.floor(Math.random() * generalSongs.length)];
    box.innerHTML = `
      <p style="font-size:20px;">¿Qué canción representan estos emojis?</p>
      <div class="emoji-song">${currentSong.emojis}</div>
      <button onclick="revealEmojiSong()" style="font-size:18px;padding:14px 30px;">💡 REVELAR RESPUESTA</button>
      <div id="emojiAnswer" style="display:none;margin:15px;font-size:30px;font-weight:900;color:#ffd54a"></div>
      <div id="emojiMusic" style="margin-top:15px;"><div id="youtubePlayerElement"></div></div>
      <button class="secondary" style="margin-top:15px;font-size:18px;padding:14px 30px;" onclick="renderChallenge(3)">🔄 OTRO reto</button>
    `;
    initYTPlayer(currentSong.url, "0");
  }
}

function revealSong(){
  const a = document.getElementById("answer");
  if(a){ a.style.display = "block"; a.textContent = "🎉 " + currentSong.title + " — " + currentSong.artist; }
}

function revealEmojiSong(){
  const a = document.getElementById("emojiAnswer");
  if(a){ a.style.display = "block"; a.textContent = "🎉 " + currentSong.title + " — " + currentSong.artist; }
}

function startTimer(){
  clearInterval(timer);
  let seconds = 10;
  const t = document.getElementById("timer");
  const bar = document.getElementById("bar");
  t.textContent = seconds;
  bar.style.width = "100%";
  timer = setInterval(()=>{
    seconds--;
    t.textContent = seconds;
    bar.style.width = (seconds * 10) + "%";
    if(seconds <= 0){
      clearInterval(timer);
      t.textContent = "⏰";
      bar.style.width = "0%";
    }
  }, 1000);
}

function backHome(){
  clearInterval(timer);
  clearAllTimeouts();

  if (challengePlayer && typeof challengePlayer.destroy === 'function') {
    challengePlayer.destroy();
  }

  document.getElementById("challengeContent").innerHTML = "";
  document.getElementById("challenge").classList.remove("active");
  document.getElementById("home").classList.add("active");

  if(userActivatedMusic){
    const iframe = document.getElementById("ambientIframe");
    ambientPlaying = true;
    try {
      iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    } catch(e) {}
  }
}
</script>
</body>
</html>
