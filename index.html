<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

body::before {
  content: "";
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg, #180b2e 0%, #3a0f52 50%, #101a45 100%);
  background-size: cover;
  z-index: -1;
  animation: changeBackground 12s infinite alternate;
}

@keyframes changeBackground {
  0% { filter: hue-rotate(0deg) brightness(1); }
  100% { filter: hue-rotate(30deg) brightness(1.15); }
}

.screen{
  position: absolute;
  top: 0; left: 0; width: 100%; min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.screen.active{
  opacity: 1;
  pointer-events: auto;
  z-index: 2;
}
.card{
  width:min(1150px, 98vw);
  background:rgba(0,0,0,0.55);
  border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(16px);
  border-radius:32px;
  padding:40px 30px;
  box-shadow:0 25px 70px rgba(0,0,0,.7);
  text-align:center;
}
h1{font-size:clamp(40px, 5vw, 62px);margin:0 0 10px;font-weight:900;}
p{font-size:20px;opacity:.9;}
.wheel-wrap{
  position:relative;
  width:min(520px, 75vw);
  aspect-ratio:1;
  margin:20px auto 30px;
}
.pointer{
  position:absolute;
  z-index:5;
  top:-12px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:24px solid transparent;
  border-right:24px solid transparent;
  border-top:44px solid #ffd54a;
  filter:drop-shadow(0 4px 6px #000);
}
canvas{
  width:100%;
  height:100%;
  border-radius:50%;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
}
button{
  border:0;
  border-radius:999px;
  padding:16px 36px;
  font-size:20px;
  font-weight:800;
  cursor:pointer;
  color:#24102f;
  background:#ffd54a;
  box-shadow:0 8px 25px rgba(0,0,0,0.3);
  transition:.2s;
}
button:hover{transform:translateY(-2px) scale(1.03);}
button:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.result{
  display:none;
  margin:20px auto 15px;
  padding:20px;
  border-radius:22px;
  background:rgba(0,0,0,.35);
}
.result.show{display:block;animation:pop .5s ease;}
.challenge-icon{font-size:75px;}
.challenge-box{
  margin:20px auto;
  max-width:800px;
  padding:30px;
  border-radius:24px;
  background:rgba(0,0,0,.35);
}
.timer{font-size:55px;font-weight:900;color:#ffd54a;margin:15px 0;}
.progress{
  height:12px;
  background:rgba(255,255,255,.18);
  border-radius:20px;
  overflow:hidden;
  margin:20px 0;
}
.bar{height:100%;width:100%;background:#ffd54a;transition:width 1s linear;}
.emoji-song{font-size:55px;letter-spacing:10px;margin:20px 0;word-break:break-all;}
.word{font-size:65px;font-weight:900;color:#ffd54a;margin:20px 0;}
.spark{font-size:28px;margin-bottom:5px;}

@keyframes pop{
  0%{transform:scale(.85);opacity:0;}
  100%{transform:scale(1);opacity:1;}
}
</style>
<script src="https://www.youtube.com/iframe_api"></script>

let selectedIndex = 0;
const wheel = document.getElementById("wheel");
const ctx = wheel.getContext("2d");
let rotation = 0;
let spinning = false;

function drawWheel(){
  const size = 1000;
  const cx = size / 2, cy = size / 2, r = 450;
  const slice = 2 * Math.PI / challenges.length;
  ctx.clearRect(0, 0, size, size);

  challenges.forEach((c,i)=>{
    const a = rotation + i * slice;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, a, a + slice);
    ctx.closePath();
    ctx.fillStyle = c.color;
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.9)";
    ctx.lineWidth = 8;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a + slice / 2);
    
    ctx.textAlign = "right";
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,0.6)";
    ctx.shadowBlur = 6;

    ctx.font = "bold 30px Arial";
    ctx.fillText(c.name[0], 340, -15);
    ctx.fillText(c.name[1], 340, 25);

    ctx.font = "bold 44px Arial";
    ctx.fillText(c.emoji, 340, 75);
    
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(cx, cy, 75, 0, Math.PI*2);
  ctx.fillStyle = "#24102f";
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.3)";
  ctx.lineWidth = 5;
  ctx.stroke();

  ctx.fillStyle = "#ffd54a";
  ctx.font = "bold 38px Arial";
  ctx.textAlign = "center";
  ctx.shadowBlur = 0;
  ctx.fillText("🏢", cx, cy+14);
}
drawWheel();

function spin(){
  if(spinning) return;
  spinning = true;
  document.getElementById("spinBtn").disabled = true;
  document.getElementById("result").classList.remove("show");

  const start = rotation;
  const turns = 7 + Math.random()*3;
  const target = start + turns * 2 * Math.PI + Math.random()*2*Math.PI;
  const duration = 4200;
  const t0 = performance.now();

  function animate(t){
    const p = Math.min(1, (t-t0)/duration);
    const ease = 1 - Math.pow(1-p, 4);
    rotation = start + (target-start)*ease;
    drawWheel();

    if(p < 1){
      requestAnimationFrame(animate);
    } else {
      const slice = 2*Math.PI / challenges.length;
      let angle = ((-Math.PI/2 - rotation) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
      selectedIndex = Math.floor(angle/slice) % challenges.length;
      showResult();
      spinning = false;
      document.getElementById("spinBtn").disabled = false;
    }
  }
  requestAnimationFrame(animate);
}

function showResult(){
  const c = challenges[selectedIndex];
  document.getElementById("resultEmoji").textContent = c.emoji;
  const fullName = c.name.join(" ");
  document.getElementById("resultTitle").textContent = "¡Te tocó: " + fullName + "!";
  document.getElementById("resultDesc").textContent = c.desc;
  document.getElementById("result").classList.add("show");
}

function startChallenge(){
  const c = challenges[selectedIndex];
  document.getElementById("home").classList.remove("active");
  document.getElementById("challenge").classList.add("active");
  document.getElementById("challengeIcon").textContent = c.emoji;
  document.getElementById("challengeTitle").textContent = c.name.join(" ");
  
  wasMusicPlayingBeforeChallenge = isMusicActive;

  if (selectedIndex === 0 || selectedIndex === 1) {
    if (isMusicActive) {
      try {
        iframeMain.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
      } catch(e) {}
    }
    
    if (selectedIndex === 0) {
      startDynamicLoop(noteSongs, 120000, 15000, true);  
    } else if (selectedIndex === 1) {
      startGuessSongWithTimer();
    }
  } else {
    stopChallengePlayer();
  }

  renderChallenge(selectedIndex);
}

function stopVolumeTracker() {
  if (volumeCheckInterval) {
    clearInterval(volumeCheckInterval);
    volumeCheckInterval = null;
  }
}

function startVolumeTracker() {
  stopVolumeTracker();
  let volumeLowered = false;
  let volumeRestored = false;

  volumeCheckInterval = setInterval(() => {
    if (challengePlayer && typeof challengePlayer.getCurrentTime === 'function' && challengePlayer.getPlayerState() === 1) {
      const currentTime = challengePlayer.getCurrentTime();

      if (currentTime >= 70 && currentTime < 90 && !volumeLowered) {
        challengePlayer.setVolume(0);
        volumeLowered = true;
      }

      if (currentTime >= 90 && !volumeRestored) {
        challengePlayer.setVolume(100);
        volumeRestored = true;
      }
    }
  }, 500);
}

function playSpecificSong(songsList, enableVolumeChanges) {
  stopVolumeTracker();
  currentSongData = songsList[Math.floor(Math.random() * songsList.length)];
  
  if (!challengePlayer) {
    challengePlayer = new YT.Player('youtube-challenge-player', {
      height: '200',
      width: '200',
      videoId: currentSongData.id,
      playerVars: {
        'autoplay': 1,
        'start': currentSongData.start,
        'enablejsapi': 1,
        'origin': window.location.origin
      },
      events: {
        'onReady': (event) => {
          event.target.setVolume(100);
          event.target.playVideo();
          if (enableVolumeChanges) {
            startVolumeTracker();
          }
        }
      }
    });
  } else {
    if (typeof challengePlayer.loadVideoById === 'function') {
      challengePlayer.loadVideoById({
        videoId: currentSongData.id,
        startSeconds: currentSongData.start
      });
      challengePlayer.setVolume(100);
      if (enableVolumeChanges) {
        startVolumeTracker();
      }
    }
  }
}

function startGuessSongWithTimer() {
  stopVolumeTracker();
  if (guessTimerInterval) clearInterval(guessTimerInterval);
  if (guessTimeout) clearTimeout(guessTimeout);

  playSpecificSong(guessSongs, false);

  let timeLeft = 30;
  const timerText = document.getElementById("guessTimerText");
  const progressBar = document.getElementById("guessProgressBar");

  if (timerText) timerText.textContent = timeLeft + "s";
  if (progressBar) progressBar.style.width = "100%";

  guessTimerInterval = setInterval(() => {
    timeLeft--;
    if (timerText) timerText.textContent = timeLeft + "s";
    if (progressBar) {
      const percent = (timeLeft / 30) * 100;
      progressBar.style.width = percent + "%";
    }
    if (timeLeft <= 0) {
      clearInterval(guessTimerInterval);
    }
  }, 1000);

  guessTimeout = setTimeout(() => {
    if (challengePlayer && typeof challengePlayer.pauseVideo === 'function') {
      challengePlayer.pauseVideo();
    }
    if (timerText) timerText.textContent = "¡Tiempo terminado! ⏸️";
  }, 30000);
}

function stopChallengePlayer() {
  stopVolumeTracker();
  if (guessTimerInterval) clearInterval(guessTimerInterval);
  if (guessTimeout) clearTimeout(guessTimeout);
  if (challengePlayer && typeof challengePlayer.stopVideo === 'function') {
    challengePlayer.stopVideo();
  }
}

function startDynamicLoop(songsList, playDuration, pauseDuration, enableVolumeChanges) {
  if (noteLoopTimer) clearInterval(noteLoopTimer);
  
  playSpecificSong(songsList, enableVolumeChanges);
  
  const totalCycle = playDuration + pauseDuration;

  noteLoopTimer = setInterval(() => {
    setTimeout(() => {
      stopChallengePlayer();
    }, playDuration);
    
    setTimeout(() => {
      playSpecificSong(songsList, enableVolumeChanges);
    }, totalCycle);
  }, totalCycle);
}

let currentAnswer = "";

function renderChallenge(i){
  const box = document.getElementById("challengeContent");
  const actionBtnBox = document.getElementById("challengeActionBtn");
  if (noteLoopTimer) clearInterval(noteLoopTimer);
  if (guessTimerInterval) clearInterval(guessTimerInterval);
  if (guessTimeout) clearTimeout(guessTimeout);
  actionBtnBox.innerHTML = "";

  if(i === 0){
    box.innerHTML = `
      <div style="font-size:75px; margin:20px 0;">🎵🎤🔥</div>
      <p style="font-size:20px;">¡Escucha la canción y continúa su letra!</p>
    `;
    actionBtnBox.innerHTML = `<button onclick="startDynamicLoop(noteSongs, 120000, 15000, true)" style="font-size:18px;padding:14px 30px;background:#ff5c8a;color:#fff;">🔀 Siguiente Canción</button>`;
  } else if(i === 1){
    box.innerHTML = `
      <div style="font-size:55px; margin:5px 0;">🎧🎶⏱️</div>
      <p style="font-size:18px; margin-bottom:5px;">La canción se pausará automáticamente en:</p>
      <div id="guessTimerText" class="timer">30s</div>
      <div class="progress"><div id="guessProgressBar" class="bar"></div></div>
    `;
    actionBtnBox.innerHTML = `<button onclick="startGuessSongWithTimer()" style="font-size:18px;padding:14px 30px;background:#7c5cff;color:#fff;">🔀 Siguiente Canción</button>`;
  } else if(i === 2){
    const words = ["AMOR", "NOCHE", "BAILAR", "CORAZÓN", "FUEGO", "VIDA", "BESO", "SOL", "FIESTA", "LOCURA"];
    const word = words[Math.floor(Math.random() * words.length)];
    box.innerHTML = `
      <p style="font-size:20px;">La palabra secreta es:</p>
      <div class="word">${word}</div>
      <p style="font-size:20px;">🎤 Canta una canción que contenga esta palabra.</p>
    `;
    actionBtnBox.innerHTML = `<button onclick="renderChallenge(2)" style="font-size:18px;padding:14px 30px;background:#00bfa6;color:#fff;">🔀 Otra Palabra</button>`;
  } else {
    const item = emojiDatabase[Math.floor(Math.random() * emojiDatabase.length)];
    currentAnswer = item.name;
    box.innerHTML = `
      <p style="font-size:20px;">¿Qué canción representan estos emojis?</p>
      <div class="emoji-song">${item.emojis}</div>
      <button onclick="revealEmojiSong()" style="font-size:18px;padding:14px 30px;margin-bottom:15px;">💡 REVELAR RESPUESTA</button>

    `;
    actionBtnBox.innerHTML = `<button onclick="renderChallenge(3)" style="font-size:18px;padding:14px 30px;background:#ff9f43;color:#fff;">🔀 Siguientes Emojis</button>`;
  }
}

function revealEmojiSong(){
  const a = document.getElementById("emojiAnswer");
  if(a){ a.style.display = "block"; a.textContent = "🎉 " + currentAnswer; }
}

function backHome(){
  if (noteLoopTimer) clearInterval(noteLoopTimer);
  if (guessTimerInterval) clearInterval(guessTimerInterval);
  if (guessTimeout) clearTimeout(guessTimeout);
  stopChallengePlayer();

  if (selectedIndex === 0 || selectedIndex === 1) {
    if (wasMusicPlayingBeforeChallenge) {
      try {
        iframeMain.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
      } catch(e) {}
    }
  }

  document.getElementById("challengeContent").innerHTML = "";
  document.getElementById("challengeActionBtn").innerHTML = "";
